<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dandiya Night — Pass Scanner</title>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;padding:18px;background:#111;color:#fff;max-width:600px;margin-inline:auto}
h1{font-size:1.4rem}.panel{background:#222;border-radius:16px;padding:16px;margin:12px 0}
button{width:100%;padding:14px;margin:6px 0;border:0;border-radius:10px;background:#d7ad56;color:#111;font-size:1rem;font-weight:700}
#reader{background:#fff;border-radius:12px;overflow:hidden;color:#111}
#result{padding:20px;border-radius:12px;margin-top:12px;text-align:center;font-weight:800;overflow-wrap:anywhere}
.valid{background:#14532d}.bad{background:#7f1d1d}.warn{background:#78350f}.neutral{background:#333}
small{color:#ccc;line-height:1.5}.hidden{display:none}
</style>
</head>
<body>
<h1>🎟️ Dandiya Night Pass Scanner</h1>
<div class="panel">
  <button id="start">Start camera scanner</button>
  <button id="stop" class="hidden">Stop scanner</button>
  <div id="reader"></div>
  <div id="result" class="neutral">Ready to scan a pass.</div>
</div>
<div class="panel">
  <p><strong>Attendance</strong> (shared across all phones)</p>
  <p id="count">Loading…</p>
</div>
<script>
// ====== FILL THESE IN (Supabase > Project Settings > API) ======
const SUPABASE_URL = "https://YOUR-PROJECT-REF.supabase.co";
const SUPABASE_ANON_KEY = "YOUR-ANON-PUBLIC-KEY";
// ================================================================

const $ = id => document.getElementById(id);
let scanner = null, busy = false, lastText = "", lastAt = 0;

async function rpc(fn, args = {}) {
  const r = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      apikey: SUPABASE_ANON_KEY,
      Authorization: `Bearer ${SUPABASE_ANON_KEY}`
    },
    body: JSON.stringify(args)
  });
  if (!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}
function result(cls, title, detail = "") {
  $("result").className = cls;
  $("result").textContent = detail ? `${title} — ${detail}` : title;
}
async function updateCount() {
  try { const s = await rpc("pass_stats"); $("count").textContent = `${s.used} of ${s.total} passes used`; }
  catch { $("count").textContent = "Offline — count unavailable"; }
}
async function checkCode(raw) {
  result("neutral", "Checking…");
  try {
    const r = await rpc("redeem_pass", { p_code: raw });
    if (r.status === "valid") result("valid", "✓ VALID — ENTRY ACCEPTED", r.code);
    else if (r.status === "used") {
      const t = r.used_at ? new Date(r.used_at).toLocaleTimeString() : "";
      result("bad", "✕ ALREADY USED", `${r.code}${t ? " at " + t : ""}`);
    } else result("bad", "✕ INVALID PASS", "Code not recognised");
    updateCount();
  } catch {
    result("warn", "⚠ NETWORK ERROR", "NOT recorded — check signal and scan again");
  }
}
$("start").onclick = async () => {
  if (scanner) return;
  if (typeof Html5Qrcode === "undefined") { result("bad", "SCANNER LIBRARY NOT LOADED", "Check internet and reload."); return; }
  scanner = new Html5Qrcode("reader");
  $("start").classList.add("hidden"); $("stop").classList.remove("hidden");
  try {
    await scanner.start({ facingMode: "environment" }, { fps: 10, qrbox: { width: 240, height: 240 } }, async decoded => {
      const now = Date.now();
      if (busy || (decoded === lastText && now - lastAt < 2500)) return;
      busy = true; lastText = decoded; lastAt = now;
      try { await checkCode(decoded); } finally { setTimeout(() => busy = false, 1400); }
    }, () => {});
    result("neutral", "Ready to scan a pass.");
  } catch {
    result("bad", "CAMERA ERROR", "Allow camera permission and use HTTPS.");
    scanner = null; $("start").classList.remove("hidden"); $("stop").classList.add("hidden");
  }
};
$("stop").onclick = async () => {
  if (scanner) { try { await scanner.stop(); } catch {} scanner = null; }
  $("start").classList.remove("hidden"); $("stop").classList.add("hidden");
  result("neutral", "Scanner stopped.");
};
updateCount();
setInterval(updateCount, 15000);
</script>
</body>
</html>
